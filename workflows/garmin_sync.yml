name: Sincronizzazione Serale Garmin

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  aggiorna-dati:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa librerie
        run: pip install garminconnect firebase-admin

      - name: Esegui Script del Coach su Firebase
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          FIREBASE_USER_UID: ${{ secrets.FIREBASE_USER_UID }}
        run: python script_motore.py
